[package]
name = "microbit-v2-starter"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "microbit-v2-starter"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
microbit-v2 = "0.16.0"

[profile.release]
codegen-units = 1
debug = true
lto = true
